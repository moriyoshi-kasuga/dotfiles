set -as terminal-features ",*:RGB"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
# Undercurl support
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Underline colours
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set-environment -g COLORTERM "truecolor"

set-option -s set-clipboard on

set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# General
set -g history-limit 50000
set -g display-time 2000
set -g display-panes-time 800
set -g focus-events on
set -sg repeat-time 600
set -g status-keys vi
set -g aggressive-resize on

# WezTermのシェル統合(OSC 7/133)・imgcatを有効化するために必要
set -g allow-passthrough on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Copy mode
# set-clipboard on によりコピー内容は OSC 52 で外側の端末へ送られるので、ローカルでも SSH 先でも同じ設定で済む
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-q send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# fish が出す OSC 133 のプロンプトマーカーを辿る
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt
bind -T copy-mode-vi Escape send-keys -X cancel

# Windows
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}'
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind p previous-window
bind n next-window
bind < swap-window -d -t -1
bind > swap-window -d -t +1

# Splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind V split-window -bh -c "#{pane_current_path}"
bind S split-window -bv -c "#{pane_current_path}"
bind N split-window -bh -l 25% -c "#{pane_current_path}"

# Pane navigation
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Pane resizing
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# Layouts
bind -r Space next-layout
bind = select-layout tiled

# Pane management
bind o kill-pane -a

# Popups
set -g popup-style "bg=default"
# catppuccin plugin が読み込まれた後なので @thm_* を設定時に展開できる
set -gF popup-border-style "fg=#{@thm_surface_2},bg=default"

# tmux 3.8 で既定値がテーマ色になったが catppuccin plugin が上書きしないもの
# catppuccin/tmux が tmux 3.8 に対応したら、この節は削除する（2.3.2 時点では未対応）
set -g window-status-current-style default
set -g pane-status-current-style default
set -g session-status-current-style default
set -gF menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF menu-border-style "fg=#{@thm_surface_1}"
set -gF copy-mode-match-style "bg=#{@thm_blue},fg=#{@thm_crust}"
set -gF copy-mode-current-match-style "bg=#{@thm_peach},fg=#{@thm_crust}"
set -gF copy-mode-mark-style "bg=#{@thm_yellow},fg=#{@thm_crust}"
set -gF copy-mode-current-line-number-style "fg=#{@thm_lavender}"
set -gF copy-mode-line-number-style "fg=#{@thm_overlay_0}"
set -gF display-panes-active-colour "#{@thm_mauve}"
set -gF display-panes-colour "#{@thm_overlay_2}"
set -gF display-panes-border-style "fg=#{@thm_surface_1}"
set -gF tree-mode-border-style "fg=#{@thm_surface_1}"
# 描画時に pane_format などを評価するため -F を付けない
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@thm_mauve},#{@thm_blue}}"
set -gF pane-scrollbars-style "bg=#{@thm_surface_0},fg=#{@thm_overlay_0},width=1,pad=0"
set -g fill-character "#{?is_inside,#[bg=#{@thm_mantle}] ,#[fg=#{@thm_surface_1}]#[acs]~}"

# Sessions
bind e choose-session
bind m display-popup -d '#{pane_current_path}' -w50% -h50% -E "~/.config/tmux/new-session.fish"
bind M choose-session "join-pane -t '%%'"
bind B display-popup -d '#{pane_current_path}' -w50% -h50% -E "~/.config/tmux/break-to-session.fish"

# Tools
bind g display-popup -d '#{pane_current_path}' -w100% -h100% -E "lazygit"

bind ] run-shell 'FILE=$(mktemp) && tmux capture-pane -epS - > "$FILE" && tmux split-window "nvim \"+term cat $FILE\" \"+set nowrap\""'
