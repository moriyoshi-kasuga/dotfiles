# OmniWM v0.7.6 (schemaVersion 4) の設定。
# modules/desktop/niri の挙動にできるだけ寄せている。
#
# スキーマは厳格で、必須キーが 1 つでも欠けるとファイル全体が無視される。
# hotkeys に書かなかった action は Unassigned になる。
# ワークスペースは niri のように縦に積む。設定に書くのは各モニターの起点だけで、
# Cmd+Ctrl+U でウィンドウ (column) を下へ送ると、下にワークスペースがなければ
# 番号付きのワークスペースが動的に作られ、空になると自動で消える。

schemaVersion = 4
monitorBarOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []

[general]
animationSpeed = 1.0
animationsEnabled = false
defaultLayoutType = "niri"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = false
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = false

[focus]
crossesMonitorAtEdge = false
followsMouse = false
followsWindowToMonitor = true
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = false
raiseOnMouseFocus = false

[mouseWarp]
constrainToArrangement = false
enabled = true
margin = 1

[routing]
arrangements = []
mode = "macOS"

[gaps]
fullscreenUsesOuterGaps = false
size = 0.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[niri]
alwaysCenterSingleColumn = false
centerFocusedColumn = "never"
containerPrimarySpanPresets = [0.5, 1.0]
defaultContainerPrimarySpan = 0.5
edgeGaps = false
infiniteLoop = false
resizeStepPercent = 10
# niri と同じく、ウィンドウが 1 つでも default の幅 (0.5) のまま置く
singleWindowFit = "container_primary_span"
visibleContainerCount = 2

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

# niri の focus-ring / border off に合わせる
[borders]
enabled = false
width = 5.0

[borders.color]
alpha = 1.0
blue = 0.979300037944676
green = 1.0
red = 0.08458520228437894

[overview]
enabled = true
invertScrollDirection = false
matchFocusBorder = true
mouseScrollSpeed = 1.0
zoom = 1.0

[overview.backdrop]
alpha = 0.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[workspaceBar]
autoHide = false
autoHideHideDelayMilliseconds = 0.0
autoHideRevealDelayMilliseconds = 0.0
backgroundOpacity = 0.1
deduplicateAppIcons = false
# 画面上部中央のワークスペース bar は出さない
enabled = false
excludedBundleIDs = []
height = 24.0
# bar を出さなくても効き、Cmd+U / Cmd+I で空のワークスペースを飛ばす
hideEmptyWorkspaces = true
hideInNativeFullscreen = false
hoverPreviewsEnabled = true
notchActiveZoneWidth = 180.0
notchMode = "moveBelowMenuBar"
notificationBadgeRefreshIntervalSeconds = 5.0
notificationBadges = "off"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showAccentHighlights = true
showFloatingWindows = false
showItemBackgrounds = true
showLabels = true
solidBlackBackground = false
systemStatsButton = false
transparentBackground = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.iconOverrides]

# niri の touchpad と同じく、3 本指の横で column、縦でワークスペースを移動する
[gestures]
fingerCount = 3
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
overviewGestureEnabled = false
overviewGestureFingerCount = 4
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
windowGestureSensitivity = 1.0
windowMoveEnabled = false
windowMoveFingerCount = 4
windowResizeEnabled = false
windowResizeFingerCount = 3
workspaceSwipeAxis = "vertical"
workspaceSwipeEnabled = true
workspaceSwipeFingerCount = 3

[statusBar]
showAppNames = false
showIcon = true
showWorkspaceName = false
useWorkspaceId = false

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[clipboard]
historyEnabled = false
ignoredTypes = []
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundBlurRadius = 0
backgroundEffect = "standardBlur"
enabled = false
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[scratchpads.labels]

[appearance]
mode = "dark"
tabRailAppIcons = false


# niri の binds.kdl に対応するものだけを割り当てる。niri の Alt は Command にする。
[[hotkeys]]
binding = "Command+O"
id = "toggleOverview"

[[hotkeys]]
binding = "Command+Q"
id = "closeFocusedWindow"

[[hotkeys]]
binding = "Command+H"
id = "focus.left"

[[hotkeys]]
binding = "Command+J"
id = "focus.down"

[[hotkeys]]
binding = "Command+K"
id = "focus.up"

[[hotkeys]]
binding = "Command+L"
id = "focus.right"

[[hotkeys]]
binding = "Control+Command+H"
id = "moveColumn.left"

[[hotkeys]]
binding = "Control+Command+J"
id = "move.down"

[[hotkeys]]
binding = "Control+Command+K"
id = "move.up"

[[hotkeys]]
binding = "Control+Command+L"
id = "moveColumn.right"

# OmniWM には方向指定の monitor focus がないので、J で前、K で次のモニターにする
[[hotkeys]]
binding = "Command+Shift+J"
id = "focusMonitorPrevious"

[[hotkeys]]
binding = "Command+Shift+K"
id = "focusMonitorNext"

[[hotkeys]]
binding = "Control+Command+Shift+H"
id = "moveWindowToMonitor.left"

[[hotkeys]]
binding = "Control+Command+Shift+J"
id = "moveWindowToMonitor.down"

[[hotkeys]]
binding = "Control+Command+Shift+K"
id = "moveWindowToMonitor.up"

[[hotkeys]]
binding = "Control+Command+Shift+L"
id = "moveWindowToMonitor.right"

# ワークスペースは縦方向。下に送ると、なければ新しいワークスペースを作る
[[hotkeys]]
binding = "Command+U"
id = "switchWorkspace.next"

[[hotkeys]]
binding = "Command+I"
id = "switchWorkspace.previous"

[[hotkeys]]
binding = "Control+Command+U"
id = "moveColumnToWorkspaceDown"

[[hotkeys]]
binding = "Control+Command+I"
id = "moveColumnToWorkspaceUp"

# niri の consume-or-expel-window-left / right に相当する
[[hotkeys]]
binding = "Command+Left Bracket"
id = "move.left"

[[hotkeys]]
binding = "Command+Right Bracket"
id = "move.right"

[[hotkeys]]
binding = "Command+Comma"
id = "consumeWindowIntoColumn"

[[hotkeys]]
binding = "Command+Period"
id = "expelWindowFromColumn"

[[hotkeys]]
binding = "Command+Shift+F"
id = "toggleContainerFullPrimarySpan"

[[hotkeys]]
binding = "Control+Command+F"
id = "toggleFullscreen"

[[hotkeys]]
binding = "Control+Command+Shift+F"
id = "toggleNativeFullscreen"


[[hotkeys]]
binding = "Command+Minus"
id = "setContainerPrimarySpan.decrease10Percent"

[[hotkeys]]
binding = "Command+Equal"
id = "setContainerPrimarySpan.increase10Percent"

[[hotkeys]]
binding = "Command+Shift+Minus"
id = "setWindowSecondarySpan.decrease10Percent"

[[hotkeys]]
binding = "Command+Shift+Equal"
id = "setWindowSecondarySpan.increase10Percent"

