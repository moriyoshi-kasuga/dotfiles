name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    # 毎週金曜 20:00 JST (11:00 UTC)
    - cron: "0 11 * * 5"

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "chore(nix): update flake.lock"
          pr-labels: |
            dependencies
            automated
          env:
            GIT_COMMIT_MESSAGE: "chore(nix): update flake.lock"
