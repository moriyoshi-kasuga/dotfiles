name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/flake-checker-action@main

      # IFD は評価中に build が要るので、Linux の CI では darwin の構成を評価できなくなる
      - run: nix flake check --print-build-logs --option allow-import-from-derivation false
